name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK (35 + build-tools 35.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Pin Android target SDK to 35
        run: |
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/'   android/variables.gradle
          cat android/variables.gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync (copies web bundle into android project)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/vision-debug.apk
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-debug-apk
          path: out/vision-debug.apk
          if-no-files-found: error
          retention-days: 30
