<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate of Achievement — RESUL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
      background: #0a0a12;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* LMS canvas: 1308 × 920 (landscape) */
    .certificate {
      --tc-accent: #0066ff;
      --tc-accent-bar: #0000e8;
      --tc-name: #ffffff;
      --tc-ink: #ffffff;
      --tc-label: #a6b0d4;
      --tc-rule: rgba(255, 255, 255, 0.18);
      --tc-link: #4da3ff;

      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 1308 / 920;
      background-color: #000510;
      background-image: url("/certificate-resul-blue.webp");
      background-image: url("https://runwizv5.resul.io//Uploads/X7P/5/lbuilder/310726114721035_0certificate_resul_blue.webp");
      background-repeat: no-repeat;
      background-size: 175% 183%;
      background-position: 59.5% 71.9%;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(77, 118, 255, 0.35);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 46px;
      height: 100%;
      background: var(--tc-accent-bar);
      z-index: 1;
    }

    .content {
      position: absolute;
      inset: 0;
      padding: 84px 100px 76px 96px;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 46px;
      flex-shrink: 0;
    }

    .logo img {
      height: 48px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 600;
      color: var(--tc-ink);
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      color: var(--tc-label);
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .presented-label {
      margin-top: 52px;
    }

    .name {
      font-size: 62px;
      font-weight: 600;
      color: var(--tc-name);
      margin-top: 12px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .completion-label {
      margin-top: 44px;
    }

    .course {
      font-size: 24px;
      font-weight: 600;
      color: var(--tc-name);
      margin-top: 10px;
      line-height: 1.3;
      word-break: break-word;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--tc-rule);
      margin-top: 50px;
      flex-shrink: 0;
    }

    .footer {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      padding-top: 34px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .field svg {
      width: 20px;
      height: 20px;
      stroke: var(--tc-ink);
      stroke-width: 1.6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .field-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--tc-label);
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .field-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--tc-ink);
      letter-spacing: 0.02em;
    }

    .field-signature .sig-line {
      width: 72px;
      height: 1px;
      background: var(--tc-ink);
      margin-bottom: 2px;
    }

    .field-signature .field-value {
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .verify-block {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .qr-frame {
      position: relative;
      width: 88px;
      height: 88px;
      padding: 6px;
      border: 2px solid var(--tc-accent);
      box-shadow: 0 0 12px rgba(0, 102, 255, 0.45);
      background: rgba(0, 5, 16, 0.6);
      flex-shrink: 0;
    }

    .qr-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .qr-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--tc-accent);
      border-style: solid;
    }

    .qr-corner.tl {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .qr-corner.tr {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
    }

    .qr-corner.bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
    }

    .qr-corner.br {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .verify-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 160px;
    }

    .verify-title {
      font-size: 9px;
      font-weight: 600;
      color: var(--tc-label);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .verify-hint {
      font-size: 9px;
      font-weight: 400;
      color: var(--tc-ink);
      line-height: 1.45;
    }

    .verify-link {
      font-size: 9px;
      font-weight: 500;
      color: var(--tc-link);
      text-decoration: none;
      line-height: 1.45;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
        min-height: 0;
      }

      .certificate {
        border-radius: 0;
        border: none;
        box-shadow: none;
        width: 100%;
        max-width: none;
        aspect-ratio: 1308 / 920;
      }

      .content {
        position: relative;
        min-height: 0;
      }
    }
  </style>
</head>

          alt="RESUL"

      <div class="label completion-label">For successful completion of</div>

      <div class="rule" aria-hidden="true"></div>

      <div class="footer">
